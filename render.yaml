services:
  - type: web
    name: chao-hsk-study
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CHAO_DATA_DIR
        value: /var/data
      - key: OCR_LANG
        value: chi_sim+rus+eng
      - key: ALI_TOKEN_PLAN_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FORMA_PUBLISH_TOKEN
        sync: false
